<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CATRA</title>
  <link rel="stylesheet" href="/css/fontawesome.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Connection indicator (global) -->
  <div id="connection-status" class="disconnected">
    <span class="dot"></span> <span class="text">Desconectado</span>
  </div>

  <!-- ============================================================
       View: Home — biblioteca + continue assistindo + busca
       ============================================================ -->
  <div id="view-home" class="view">
    <header class="home-header">
      <h1 class="app-title">CATRA</h1>
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Buscar..." autocomplete="off" />
      </div>
    </header>

    <!-- Live transmission banner (visible while casting to a TV) -->
    <section id="cast-banner" class="home-section" style="display:none">
      <button id="btn-follow-cast" class="cast-banner-btn" type="button">
        <span class="cast-banner-icon"><i class="fa-solid fa-tv"></i></span>
        <span class="cast-banner-text">
          <strong>Acompanhar transmissão</strong>
          <span id="cast-banner-detail"></span>
        </span>
        <span class="cast-banner-arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </button>
    </section>

    <section id="continue-watching" class="home-section">
      <h2 class="section-title">Continue Assistindo</h2>
      <div id="continue-list" class="card-grid"></div>
    </section>

    <section id="categories" class="home-section">
      <h2 class="section-title">Categorias</h2>
      <div id="category-list" class="card-grid"></div>
    </section>

    <section id="search-results" class="home-section" style="display:none">
      <h2 class="section-title">Resultados da Busca</h2>
      <div id="search-list" class="card-grid"></div>
    </section>
  </div>

  <!-- ============================================================
       View: Category — itens (séries/filmes) de uma categoria
       ============================================================ -->
  <div id="view-category" class="view" style="display:none">
    <header class="detail-header">
      <button id="btn-back-category" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
      <h1 id="category-title" class="detail-title"></h1>
    </header>
    <div id="category-items" class="card-grid"></div>
  </div>

  <!-- ============================================================
       View: Detail — episódios de um item
       ============================================================ -->
  <div id="view-detail" class="view" style="display:none">
    <header class="detail-header">
      <button id="btn-back-episodes" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
      <h1 id="detail-title" class="detail-title"></h1>
    </header>
    <div id="episode-list" class="episode-grid"></div>
  </div>

  <!-- ============================================================
       View: Player — reprodução (remote control migrado)
       ============================================================ -->
  <div id="view-player" class="view" style="display:none">
    <header class="player-header-bar">
      <button id="btn-back-detail" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
      <div class="player-header">
        <h1 id="player-title" class="player-title">Nenhum vídeo em reprodução</h1>
        <select id="profile-select">
          <option value="original">Original</option>
          <option value="local">Local</option>
          <option value="dlna">DLNA</option>
        </select>
        <div class="cast-box">
          <button id="btn-cast" class="transport-btn" title="Transmitir para dispositivo (DLNA)"><i class="fa-solid fa-tv"></i> Transmitir</button>
          <div id="cast-device-list" class="cast-device-list" style="display:none"></div>
        </div>
      </div>
    </header>

    <!-- Video element -->
    <div id="video-container">
      <video id="video-player" controls></video>
    </div>

    <!-- Thumbnail (fallback when no video src) -->
    <div id="thumbnail-container">
      <img id="thumbnail" src="" alt="" />
    </div>

    <!-- Progress bar -->
    <div id="progress-container">
      <span id="current-time">00:00</span>
      <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" />
      <span id="total-time">00:00</span>
    </div>

    <!-- Transport controls -->
    <div id="transport-controls">
      <button id="btn-prev" class="transport-btn" disabled><i class="fa-solid fa-backward-step"></i></button>
      <button id="btn-back" class="transport-btn"><i class="fa-solid fa-rotate-left"></i></button>
      <button id="btn-play-pause" class="transport-btn primary"><i class="fa-solid fa-play"></i></button>
      <button id="btn-forward" class="transport-btn"><i class="fa-solid fa-rotate-right"></i></button>
      <button id="btn-next" class="transport-btn" disabled><i class="fa-solid fa-forward-step"></i></button>
    </div>

    <!-- Skip intro button -->
    <button id="btn-skip-intro" class="skip-intro-btn" disabled>
      Pular Abertura
    </button>

    <!-- Volume -->
    <div id="volume-container">
      <span id="volume-icon"><i class="fa-solid fa-volume-high"></i></span>
      <input type="range" id="volume-bar" min="0" max="100" value="100" />
      <span id="volume-value">100</span>
    </div>

    <!-- Device + Profile info -->
    <div id="device-info">
      <span id="device-name"></span>
      <button id="btn-stop-cast" class="transport-btn" style="display:none"><i class="fa-solid fa-stop"></i> Parar transmissão</button>
      <span id="profile-label"></span>
    </div>

    <!-- Queue -->
    <div id="queue-section">
      <h3>Próximos</h3>
      <div id="queue-list"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
